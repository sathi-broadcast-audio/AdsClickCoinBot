<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>👥 Referral Center</h1>
        <div class="card">
            <p>Your Referral Link</p>
            <input type="text" id="referralLinkInput" readonly style="width:100%; padding:10px; margin:10px 0; border-radius:5px; border:none;">
            <button id="copyBtn" class="btn">Copy Link</button>
        </div>
        <div class="card">
            <h3>Total Referrals</h3>
            <p id="refCount" style="font-size:24px; color:gold;">0</p>
        </div>
    </div>
    <div class="navbar">
        <a href="index.html">🏠</a><a href="tasks.html">📺</a><a href="refer.html">👥</a><a href="wallet.html">💰</a><a href="profile.html">👤</a>
    </div>
    <script src="script.js"></script>
    <script>
        document.getElementById("copyBtn").addEventListener("click", () => {
            const input = document.getElementById("referralLinkInput");
            input.select();
            document.execCommand("copy");
            alert("Referral link copied!");
        });
    </script>
</body>
</html>
