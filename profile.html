<!DOCTYPE html>
<html lang="en">

<body>

<div class="container">

<h1>👤 Profile</h1>

<div class="card">

id="profilePhoto"
class="profile-img"
src="https://via.placeholder.com/100"
alt="Profile Photo">

<br>

<h2 id="userName">
Telegram User
</h2>

</div>

<div class="info-box">
<div class="label">User ID</div>
<div class="value" id="userId">
000000000
</div>
</div>

<div class="info-box">
<div class="label">Username</div>
<div class="value" id="username">
@username
</div>
</div>

<div class="info-box">
<div class="label">Balance</div>
<div class="value" id="userBalance">
0 Tk
</div>
</div>

<div class="info-box">
<div class="label">Referral Earnings</div>
<div class="value" id="referralIncome">
0 Tk
</div>
</div>

<div class="info-box">
<div class="label">Join Date</div>
<div class="value" id="joinDate">
09 June 2026
</div>
</div>

<div class="footer-space"></div>

<div class="navbar">
